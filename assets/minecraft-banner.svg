<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" role="img" aria-label="Andrej Rodic Minecraft-style scene" shape-rendering="crispEdges">
  <defs>
    <style>
      @keyframes groundScroll { from { transform: translateX(0); } to { transform: translateX(-48px); } }
      @keyframes cloudDrift { from { transform: translateX(0); } to { transform: translateX(-1200px); } }
      @keyframes playerBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
      .ground { animation: groundScroll .8s steps(4) infinite; }
      .clouds { animation: cloudDrift 32s linear infinite; }
      .player { animation: playerBob .48s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .ground,.clouds,.player { animation: none; }
      }
    </style>
    <pattern id="dirt" width="48" height="48" patternUnits="userSpaceOnUse">
      <rect width="48" height="48" fill="#7b4e2f"/>
      <rect x="5" y="10" width="14" height="7" fill="#8d5c38"/>
      <rect x="29" y="29" width="12" height="6" fill="#684027"/>
      <rect x="36" y="5" width="7" height="6" fill="#96643d"/>
    </pattern>
  </defs>

  <rect width="1200" height="210" fill="#78c8e8"/>

  <g class="clouds" fill="#f7fbff">
    <g><rect x="70" y="40" width="92" height="16"/><rect x="94" y="30" width="48" height="10"/></g>
    <g><rect x="385" y="63" width="110" height="16"/><rect x="421" y="52" width="52" height="11"/></g>
    <g><rect x="815" y="34" width="106" height="16"/><rect x="849" y="24" width="50" height="10"/></g>
    <g><rect x="1050" y="67" width="88" height="14"/><rect x="1080" y="58" width="43" height="9"/></g>
    <g><rect x="1270" y="40" width="92" height="16"/><rect x="1294" y="30" width="48" height="10"/></g>
    <g><rect x="1585" y="63" width="110" height="16"/><rect x="1621" y="52" width="52" height="11"/></g>
    <g><rect x="2015" y="34" width="106" height="16"/><rect x="2049" y="24" width="50" height="10"/></g>
    <g><rect x="2250" y="67" width="88" height="14"/><rect x="2280" y="58" width="43" height="9"/></g>
  </g>

  <g class="ground">
    <rect x="-48" y="158" width="1296" height="52" fill="url(#dirt)"/>
    <rect x="-48" y="153" width="1296" height="13" fill="#5d8f35"/>
    <rect x="-48" y="153" width="1296" height="4" fill="#8dcc4b"/>
    <g stroke="#50311f" stroke-width="1" opacity=".45">
      <path d="M0 166v44M48 166v44M96 166v44M144 166v44M192 166v44M240 166v44M288 166v44M336 166v44M384 166v44M432 166v44M480 166v44M528 166v44M576 166v44M624 166v44M672 166v44M720 166v44M768 166v44M816 166v44M864 166v44M912 166v44M960 166v44M1008 166v44M1056 166v44M1104 166v44M1152 166v44M1200 166v44"/>
    </g>
  </g>

  <g transform="translate(574 51)">
    <g class="player">
      <!-- square Steve-style head -->
      <rect x="10" y="0" width="32" height="32" fill="#b97952"/>
      <rect x="10" y="0" width="32" height="7" fill="#342117"/>
      <rect x="10" y="7" width="6" height="13" fill="#342117"/>
      <rect x="36" y="7" width="6" height="12" fill="#342117"/>
      <rect x="16" y="13" width="5" height="5" fill="#f2ddc4"/>
      <rect x="31" y="13" width="5" height="5" fill="#f2ddc4"/>
      <rect x="18" y="14" width="3" height="3" fill="#3f77a5"/>
      <rect x="31" y="14" width="3" height="3" fill="#3f77a5"/>
      <rect x="23" y="19" width="6" height="5" fill="#9c5f43"/>
      <rect x="16" y="24" width="5" height="5" fill="#342117"/>
      <rect x="31" y="24" width="5" height="5" fill="#342117"/>
      <rect x="21" y="27" width="10" height="5" fill="#342117"/>

      <!-- turquoise shirt and block arms -->
      <rect x="12" y="32" width="28" height="36" fill="#36a5a5"/>
      <rect x="12" y="32" width="28" height="6" fill="#55c1bb"/>
      <rect x="4" y="34" width="8" height="34" fill="#b97952"/>
      <rect x="40" y="34" width="8" height="34" fill="#b97952"/>
      <rect x="4" y="34" width="8" height="10" fill="#36a5a5"/>
      <rect x="40" y="34" width="8" height="10" fill="#36a5a5"/>

      <!-- separate pants and boots, attached below torso -->
      <rect x="12" y="68" width="14" height="29" fill="#3b4f91"/>
      <rect x="26" y="68" width="14" height="29" fill="#31447f"/>
      <rect x="10" y="97" width="16" height="5" fill="#202b4b"/>
      <rect x="26" y="97" width="16" height="5" fill="#202b4b"/>
    </g>
  </g>

  <text x="34" y="28" fill="#174866" font-family="ui-monospace,monospace" font-size="16" font-weight="700">ANDREJ RODIC • CS @ UCSB</text>
</svg>
